controller_server:
  ros__parameters:
    FollowPath:
      time_steps: 72
      model_dt: 0.05
      batch_size: 2000
      motion_model: DiffDrive
      prune_distance: 2.5
      ax_max: 1.0
      ax_min: -1.2
      az_max: 2.0
      CostCritic: {consider_footprint: true, cost_weight: 3.81, trajectory_point_step: 1}
      PathAlignCritic: {cost_weight: 5.0, max_path_occupancy_ratio: 0.05}
      PathFollowCritic: {cost_weight: 5.0}
local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 10.0
      publish_frequency: 5.0
      width: 6
      height: 6
      plugins: [obstacle_layer, inflation_layer]
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        observation_sources: scan
        scan:
          topic: /scan
          data_type: LaserScan
          marking: true
          clearing: true
          min_obstacle_height: 0.0
          max_obstacle_height: 2.0
          inf_is_valid: true
          observation_persistence: 0.0
          expected_update_rate: 0.0
          obstacle_max_range: 3.4
          raytrace_max_range: 3.5
      inflation_layer: {inflation_radius: 0.6, cost_scaling_factor: 5.0}
global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 2.0
      publish_frequency: 2.0
      obstacle_layer:
        scan: {inf_is_valid: true, observation_persistence: 0.0, obstacle_max_range: 3.4, raytrace_max_range: 3.5}
      inflation_layer: {inflation_radius: 0.6, cost_scaling_factor: 5.0}
