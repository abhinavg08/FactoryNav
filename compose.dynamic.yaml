services:
  simulation:
    environment:
      GZ_SIM_RESOURCE_PATH: /workspace/.cache/models
      FACTORYNAV_PROFILE: ${FACTORYNAV_PROFILE:-dynamic}
      FACTORYNAV_GUI: ${FACTORYNAV_GUI:-false}
      FACTORYNAV_PERCEPTION: ${FACTORYNAV_PERCEPTION:-false}
      FACTORYNAV_START_X: ${FACTORYNAV_START_X:--8.0}
      FACTORYNAV_START_Y: ${FACTORYNAV_START_Y:--6.5}
      FACTORYNAV_START_YAW: ${FACTORYNAV_START_YAW:-0.0}
      FACTORYNAV_TRAFFIC: ${FACTORYNAV_TRAFFIC:-none}
      FACTORYNAV_FORECAST: ${FACTORYNAV_FORECAST:-true}
      FACTORYNAV_DEBUG_TRAJECTORIES: ${FACTORYNAV_DEBUG_TRAJECTORIES:-false}
    command: ["bash", "/workspace/scripts/run_dynamic.sh"]
