amcl:
  ros__parameters:
    set_initial_pose: true
    initial_pose: {x: -8.0, y: -6.5, z: 0.0, yaw: 0.0}
controller_server:
  ros__parameters:
    controller_frequency: 20.0
    progress_checker: {required_movement_radius: 0.35, movement_time_allowance: 20.0}
    FollowPath:
      vx_max: 0.35
      vx_min: -0.15
      wz_max: 1.2
      visualize: false
velocity_smoother:
  ros__parameters:
    max_velocity: [0.35, 0.0, 1.2]
    min_velocity: [-0.15, 0.0, -1.2]
local_costmap:
  local_costmap:
    ros__parameters:
      footprint: "[[-0.22,-0.20],[0.16,-0.20],[0.16,0.20],[-0.22,0.20]]"
      always_send_full_costmap: true
global_costmap:
  global_costmap:
    ros__parameters:
      footprint: "[[-0.22,-0.20],[0.16,-0.20],[0.16,0.20],[-0.22,0.20]]"
      always_send_full_costmap: true
